nodeLinker: "node-modules"

# @napi-rs/wasm-runtime 1.2 moved @emnapi/* to peerDependencies, which
# @astrojs/astro2tsx (via @astrojs/check) doesn't provide. Without them
# `astro check` fails to import and silently skips type-checking.
packageExtensions:
  "@napi-rs/wasm-runtime@^1.2.0":
    dependencies:
      "@emnapi/core": "^1.7.1"
      "@emnapi/runtime": "^1.7.1"
